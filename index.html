<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EFCLoyalty</title>
<meta name="theme-color" content="#163963">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --mau: #163963; --mau-toi: #0F2A4A; --vang: #C0A866; --vang-nhat: #F7F1CF;
    --chu: #14243A; --phu: #5B6B80; --nen: #FBF9F3; --the-nen: #fff; --vien: #E7E0CB;
    --loi: #A2452E; --loi-nen: #FCEDE8; --dat: #1E7B4F; --dat-nen: #E3F3EA;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--chu);
         background: var(--nen); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  main { max-width: 440px; margin: 0 auto; padding: 20px 16px 40px; }
  .dau-trang { display: flex; align-items: center; gap: 10px; padding-top: 4px; }
  .dau-trang img { width: 40px; height: 40px; border-radius: 10px; }
  h1 { font-size: 1.4rem; line-height: 1.3; margin: 0; }
  .phu { color: var(--phu); font-size: .95rem; }
  .the { background: var(--the-nen); border: 1px solid var(--vien); border-radius: 14px; padding: 18px; margin-top: 18px; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  input[type=tel] { width: 100%; min-height: 48px; padding: 10px 12px; font: inherit; border: 1px solid var(--vien); border-radius: 10px; }
  input[type=tel]:focus { outline: 2px solid var(--vang); outline-offset: 1px; border-color: var(--mau); }
  .dong-y { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; font-size: .92rem; }
  .dong-y input { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--mau); }
  button { width: 100%; min-height: 52px; margin-top: 16px; font: inherit; font-weight: 700; color: #fff; background: var(--mau);
           border: 0; border-radius: 12px; cursor: pointer; transition: background .15s; }
  button:hover { background: var(--mau-toi); } button:disabled { opacity: .6; }
  .bao { margin-top: 12px; font-size: .95rem; } .bao.loi { color: var(--loi); } .bao.dat { color: var(--dat); }
  [hidden] { display: none !important; }
  .the-qua { border: 1px solid var(--vien); border-radius: 14px; overflow: hidden; margin-top: 18px; background: var(--the-nen); }
  .the-qua .banner { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
  .the-qua .banner-chu { width: 100%; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--mau), var(--mau-toi) 65%, var(--vang)); color: #fff; font-weight: 700;
    font-size: 1.1rem; text-align: center; padding: 16px; }
  .the-qua .noi-dung { padding: 14px; } .the-qua h2 { margin: 0 0 8px; font-size: 1.1rem; }
  .the-qua a.mo-qua { display: inline-block; color: var(--mau); font-weight: 700; }
</style>
</head>
<body>
<main>
  <div class="dau-trang"><img src="icon-192.png" alt="EFCLoyalty"><h1>EFCLoyalty</h1></div>
  <p class="phu">Một người một mã, một nguồn giới thiệu rõ ràng</p>

  <section id="khung-qua" hidden></section>

  <section class="the" id="khung-form">
    <form id="form" novalidate>
      <label for="sdt">Số điện thoại</label>
      <input type="tel" id="sdt" autocomplete="tel" inputmode="tel" placeholder="09xx xxx xxx" required>
      <!-- Lời đồng ý: NHÁP, cần Ong Thợ Pháp chế rà trước khi ra mắt. Đổi chữ thì phải tăng CONSENT_VER. -->
      <div class="dong-y">
        <input type="checkbox" id="dong-y">
        <label for="dong-y" style="margin:0;font-weight:400">Tôi đồng ý cho EFCLoyalty lưu số điện thoại để liên hệ về nội dung này. Chỉ người quản trị xem được số điện thoại đầy đủ, có ghi lý do mỗi lần xem. Tôi có thể yêu cầu xoá bất kỳ lúc nào.</label>
      </div>
      <button type="submit" id="nut">Gửi thông tin</button>
      <p class="bao" id="bao" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="the" id="khung-xong" hidden>
    <p class="bao dat">Thông tin của bạn đã được tiếp nhận.</p>
    <p class="phu">Cảm ơn bạn đã quan tâm. Thông tin đã được gửi tới <span id="xong-donvi">đội ngũ phụ trách</span>.</p>
    <p class="phu" id="xong-han" hidden></p>
    <p class="phu" id="xong-hotro" hidden></p>
  </section>
</main>

<script type="module">
import { taoOutbox, khoIndexedDB } from './outbox.js';

const API_GOC = 'https://ctv-platform-lead-identity.efcare.workers.dev';
const PHIEN_BAN_DONG_Y = 'v2'; // v2: đổi tên thương hiệu sang EFCLoyalty trong lời đồng ý (10/11/2026)
const PROGRAM_CODE = 'EFCARE';   // program_code đầu tiên, theo quyết định 09/11/2026
const $ = id => document.getElementById(id);
const ob = taoOutbox({ store: khoIndexedDB() });
let henGio = null;

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// Attribution lấy từ đường dẫn landing page do CTV chia sẻ (Module C/G): ?ref=<referrer_code>&cmp=<campaign_id>&hook=<hook_id>
const qs = new URLSearchParams(location.search);
const attribution = { referrer_code: qs.get('ref') || null, campaign_id: qs.get('cmp') || null, hook_id: qs.get('hook') || null };

// Có ?hook= trong link CTV chia sẻ: hiện đúng món quà trước khi hỏi SĐT, để link có nội dung thật, không phải form trống.
if (attribution.hook_id) {
  fetch(API_GOC + '/api/v1/hooks/' + encodeURIComponent(attribution.hook_id)).then(r => r.json()).then(d => {
    if (!d.ok) return;
    const h = d.hook;
    const khung = $('khung-qua'); khung.hidden = false;
    const the = document.createElement('div'); the.className = 'the-qua';
    const banner = document.createElement(h.banner_image_url ? 'img' : 'div');
    if (h.banner_image_url) { banner.className = 'banner'; banner.src = h.banner_image_url; banner.alt = h.title; }
    else { banner.className = 'banner-chu'; banner.textContent = h.title; }
    the.appendChild(banner);
    const noiDung = document.createElement('div'); noiDung.className = 'noi-dung';
    const tieuDe = document.createElement('h2'); tieuDe.textContent = h.title; noiDung.appendChild(tieuDe);
    const mo = document.createElement('a'); mo.className = 'mo-qua'; mo.href = h.resource_url; mo.target = '_blank'; mo.rel = 'noopener';
    mo.textContent = 'Xem quà →'; noiDung.appendChild(mo);
    the.appendChild(noiDung); khung.appendChild(the);
  }).catch(() => {});
}

function bao(chu, loai = '') { const p = $('bao'); p.textContent = chu; p.className = 'bao ' + loai; }
const LOI = { SAI_DANH_TINH: 'Số điện thoại chưa đúng.', CHUA_DONG_Y: 'Vui lòng tick đồng ý để tiếp tục.',
  CHUA_CAU_HINH: 'Hệ thống đang tạm dừng nhận thông tin. Vui lòng quay lại sau.',
  DANH_TINH_DA_THU_HOI: 'Số điện thoại này đã yêu cầu ngừng liên hệ trước đó.' };

// Kaizen UX #3 (phản biện GPT 10/11): nêu rõ đơn vị/thời hạn/kênh hỗ trợ — CHỈ khi backend đã cấu hình thật
// (next_step), không tự bịa lời hứa thời hạn liên hệ.
function hienThiXong(nextStep) {
  if (nextStep && nextStep.organization) $('xong-donvi').textContent = nextStep.organization;
  if (nextStep && nextStep.expected_contact_text) { $('xong-han').textContent = nextStep.expected_contact_text; $('xong-han').hidden = false; }
  if (nextStep && nextStep.support_url) { $('xong-hotro').innerHTML = 'Cần hỗ trợ hoặc muốn rút lại yêu cầu? <a href="' + nextStep.support_url + '">Liên hệ tại đây</a>.'; $('xong-hotro').hidden = false; }
  $('khung-form').hidden = true; $('khung-xong').hidden = false;
}

// Kaizen UX #4: phân biệt rõ "đang chờ gửi trên máy" / "đang gửi lên máy chủ" / "máy chủ đã xác nhận" —
// không báo "đã tiếp nhận" trước khi thật sự có xác nhận từ máy chủ.
async function gui() {
  clearTimeout(henGio);
  bao('Đang gửi lên máy chủ…');
  const kq = await ob.xa();
  for (const x of kq.xong) if (x.data && x.data.ok) hienThiXong(x.data.next_step);
  if (kq.loi.length) {
    const ma = kq.loi[0].item.ma;
    bao(LOI[ma] || 'Không gửi được thông tin. Vui lòng kiểm tra lại và gửi lại.', 'loi');
    for (const x of kq.loi) await ob.bo(x.item.client_tx_id);   // để khách sửa và gửi lại
    $('nut').disabled = false;
  }
  if (kq.hen_luc) {
    bao('Thông tin đang chờ gửi trên thiết bị của bạn — mạng đang chập chờn, hệ thống sẽ tự gửi lại khi có mạng. Bạn có thể giữ trang này hoặc mở lại sau.', '');
    henGio = setTimeout(gui, Math.max(1000, kq.hen_luc - Date.now()));
  }
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const phone = $('sdt').value.trim();
  if (!phone) return bao('Vui lòng nhập số điện thoại.', 'loi');
  if (!$('dong-y').checked) return bao(LOI.CHUA_DONG_Y, 'loi');
  $('nut').disabled = true; bao('Đã lưu trên máy, đang chuyển tiếp…');
  // Ghi vào máy TRƯỚC khi gửi: mất mạng giữa chừng cũng không mất, gửi lại không tạo lead trùng.
  await ob.them(API_GOC + '/api/v1/leads', {
    client_tx_id: crypto.randomUUID(), program_code: PROGRAM_CODE,
    identity: { type: 'PHONE', value: phone }, consent: true, consent_ver: PHIEN_BAN_DONG_Y, attribution
  });
  await gui();
});

window.addEventListener('online', gui);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') gui(); });
gui();   // mở lại trang: gửi nốt những gì còn trong máy
</script>
</body>
</html>
